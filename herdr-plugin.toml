# fork deployment (branch deploy/haemin, DEPLOY-FORK.md): its own plugin id, so herdr gives it
# its own config and state beside the canonical devswha.herdr-web-ui install
id = "haeminway1.herdr-web-ui"
name = "herdr web ui (fork)"
version = "0.3.4301"
min_herdr_version = "0.9.0"
description = "Browser and phone client for herdr: chat and live terminal for every agent pane, remote PCs over SSH, web push alerts"
platforms = ["linux", "macos"]

# what is missing, in one line, before `bun install` would fail some steps later
[[build]]
command = ["sh", "scripts/preflight.sh"]

[[build]]
command = ["bun", "install"]

[[build]]
command = ["bun", "run", "build"]

# One-shot per herdr start: brings the bridge up if it is not already answering.
[[startup]]
command = ["bun", "scripts/plugin.ts", "start"]

[[actions]]
id = "start"
title = "Start herdr web ui"
contexts = ["workspace"]
command = ["bun", "scripts/plugin.ts", "start"]

[[actions]]
id = "stop"
title = "Stop herdr web ui"
contexts = ["workspace"]
command = ["bun", "scripts/plugin.ts", "stop"]

[[actions]]
id = "status"
title = "herdr web ui status"
contexts = ["workspace"]
command = ["bun", "scripts/plugin.ts", "status"]

[[panes]]
id = "phone"
title = "Phone setup"
placement = "zoomed"
command = ["bun", "scripts/plugin.ts", "phone-setup"]

[[actions]]
id = "phone"
title = "Phone setup"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "haeminway1.herdr-web-ui", "--entrypoint", "phone", "--placement", "zoomed", "--focus"]
